name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kidschores
          POSTGRES_PASSWORD: kidschores_test
          POSTGRES_DB: kidschores_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check app/ tests/

      - name: Type check (mypy)
        working-directory: backend
        run: mypy app/

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://kidschores:kidschores_test@localhost:5432/kidschores_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-secret-not-for-production
        run: pytest tests/ -v --cov=app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        continue-on-error: true # no CODECOV_TOKEN configured yet — nice-to-have, not a gate
        with:
          files: backend/coverage.xml

  ios:
    name: iOS (build + test)
    runs-on: macos-14
    # The SwiftUI client (docs/ios-prd.md) hasn't been scaffolded in ios/ yet —
    # skip cleanly instead of failing on a missing .xcodeproj until it exists.

    steps:
      - uses: actions/checkout@v4

      - name: Check for Xcode project
        id: check
        run: |
          if [ -f "ios/KidsChores.xcodeproj/project.pbxproj" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ios/KidsChores.xcodeproj not found yet — skipping iOS build/test."
          fi

      - name: Select Xcode
        if: steps.check.outputs.exists == 'true'
        run: sudo xcode-select -s /Applications/Xcode_16.0.app

      - name: Build & test
        if: steps.check.outputs.exists == 'true'
        working-directory: ios
        run: |
          xcodebuild test \
            -project KidsChores.xcodeproj \
            -scheme KidsChores \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.0' \
            -resultBundlePath TestResults \
            | xcbeautify

      - name: Upload test results
        if: steps.check.outputs.exists == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ios/TestResults.xcresult
