[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kidschores-backend"
version = "0.1.0"
description = "KidsChores backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "python-jose[cryptography]>=3.3",
    "argon2-cffi>=23.1",     # password hashing (email/password auth)
    "httpx>=0.27",           # Apple identity token validation
    "celery[redis]>=5.4",
    "redis>=5.0",
    "aioapns>=3.0",
    "pytz>=2024.1",
    "python-multipart>=0.0.9",
    "structlog>=24.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",           # TestClient
    "anyio>=4.4",
    "factory-boy>=3.3",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-pytz",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "N"]
# B008: Depends(...) in a parameter default is the required FastAPI DI idiom,
# not the mutable-default footgun this rule targets.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
