app = 'kidschores-api'
primary_region = 'iad'

[build]

[deploy]
  release_command = 'alembic upgrade head'

[env]
  APP_ENV = 'production'
  APP_DEBUG = 'true'

[processes]
  app = 'uvicorn app.main:app --host 0.0.0.0 --port 8000'
  worker = 'celery -A app.workers.celery_app worker --beat --loglevel=info'

# Only "app" is a public HTTP service. "worker" (Celery + beat) has no
# service block at all, so Fly never tries to auto-stop/start it on request
# traffic — it just runs continuously on its own single small machine, which
# is required for the nightly instance-generation job to actually fire.
[http_service]
  internal_port = 8000
  force_https = true
  processes = ['app']
  # Cost-optimized: scale "app" to zero when idle, accept cold-start latency
  # on the first request after a quiet period.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  processes = ['app']
  size = 'shared-cpu-1x'
  memory = '256mb'

[[vm]]
  processes = ['worker']
  size = 'shared-cpu-1x'
  memory = '256mb'
